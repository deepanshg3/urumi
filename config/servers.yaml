# Upstream MCP server registry.
# Initial default states are defined here; runtime overrides (enable/disable,
# dynamic registrations) will be persisted in the gateway database (Pass 6).
#
# WooCommerce (Pass 2), Inventory (Pass 3) and Shipping (Pass 4) run as
# standalone Streamable HTTP services. The gateway discovers and aggregates
# their tools; enable/disable state is persisted in the gateway database.

servers:
  - id: woocommerce
    name: WooCommerce MCP
    description: Products and orders via the WooCommerce REST API.
    transport: streamable-http
    url: http://127.0.0.1:8101/mcp
    health_url: http://127.0.0.1:8101/health/ready
    enabled: true

  - id: inventory
    name: Inventory MCP
    description: Stock lookup, low-stock detection, inventory summaries, reorder recommendations.
    transport: streamable-http
    url: http://127.0.0.1:8102/mcp
    health_url: http://127.0.0.1:8102/health/ready
    enabled: true

  - id: shipping
    name: Shipping and Fulfillment MCP
    description: Shipment records, tracking status, pending fulfillments (mock provider).
    transport: streamable-http
    url: http://127.0.0.1:8103/mcp
    health_url: http://127.0.0.1:8103/health/ready
    enabled: true
