{{- if and .Values.woocommerce.enabled .Values.woocommerce.mariadb }}
{{- $full := include "urumi.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-mariadb
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  selector:
    app.kubernetes.io/name: {{ include "urumi.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-mariadb
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "urumi.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "urumi.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mariadb
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mariadb
          image: {{ include "urumi.image" (list . .Values.woocommerce.mariadb.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: mariadb-root-password
            - name: MARIADB_DATABASE
              value: {{ .Values.woocommerce.mariadb.auth.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.woocommerce.mariadb.auth.username | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: mariadb-password
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$MARIADB_ROOT_PASSWORD\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$MARIADB_ROOT_PASSWORD\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.woocommerce.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        {{- if .Values.woocommerce.mariadb.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $full }}-mariadb
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
---
{{- if .Values.woocommerce.mariadb.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $full }}-mariadb
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.woocommerce.mariadb.persistence.storageClass }}
  storageClassName: {{ .Values.woocommerce.mariadb.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.woocommerce.mariadb.persistence.size }}
{{- end }}
{{- end }}
