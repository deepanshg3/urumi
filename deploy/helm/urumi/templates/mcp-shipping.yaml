{{- if .Values.shippingMcp.enabled }}
{{- $full := include "urumi.fullname" . -}}
{{- $storeUrl := "" -}}
{{- if .Values.woocommerce.enabled -}}{{- $storeUrl = printf "http://%s-wordpress:80" $full -}}{{- else -}}{{- $storeUrl = .Values.shippingMcp.env.WOOCOMMERCE_BASE_URL | default "" -}}{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-shipping-mcp
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: shipping-mcp
spec:
  selector:
    app.kubernetes.io/name: {{ include "urumi.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: shipping-mcp
  ports:
    - name: http
      port: 8103
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-shipping-mcp
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: shipping-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "urumi.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: shipping-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "urumi.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: shipping-mcp
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: shipping-mcp
          image: {{ include "urumi.image" (list . .Values.shippingMcp.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8103
          env:
            - name: SHIPPING_MCP_HOST
              value: 0.0.0.0
            - name: SHIPPING_MCP_PORT
              value: "8103"
            - name: SHIPPING_DATABASE_URL
              value: sqlite+aiosqlite:///./data/shipping.db
            - name: SHIPPING_MOCK_MODE
              value: {{ .Values.shippingMcp.mockMode | quote }}
            - name: WOOCOMMERCE_BASE_URL
              value: {{ $storeUrl | quote }}
            - name: WOOCOMMERCE_SIGNING_BASE_URL
              value: {{ if .Values.woocommerce.enabled }}{{ .Values.woocommerce.publicUrl | default $storeUrl | quote }}{{ else }}{{ $storeUrl | quote }}{{ end }}
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: woocommerce-consumer-key
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: woocommerce-consumer-secret
            - name: MCP_ALLOWED_HOSTS
              value: "{{ $full }}-shipping-mcp,{{ $full }}-shipping-mcp:*,localhost:*,127.0.0.1:*"
            - name: LOG_LEVEL
              value: {{ .Values.shippingMcp.logLevel | default "INFO" | quote }}
            {{- range $key, $value := .Values.shippingMcp.env }}
            {{- if ne $key "WOOCOMMERCE_BASE_URL" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.shippingMcp.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        {{- if .Values.shippingMcp.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $full }}-shipping
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
---
{{- if .Values.shippingMcp.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $full }}-shipping
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: shipping-mcp
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.shippingMcp.persistence.storageClass }}
  storageClassName: {{ .Values.shippingMcp.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.shippingMcp.persistence.size }}
{{- end }}
{{- end }}
