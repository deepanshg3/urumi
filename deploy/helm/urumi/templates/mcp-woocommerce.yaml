{{- if .Values.woocommerceMcp.enabled }}
{{- $full := include "urumi.fullname" . -}}
{{- $storeUrl := "" -}}
{{- if .Values.woocommerce.enabled -}}{{- $storeUrl = printf "http://%s-wordpress:80" $full -}}{{- else -}}{{- $storeUrl = .Values.woocommerceMcp.env.WOOCOMMERCE_BASE_URL | default "" -}}{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-woocommerce-mcp
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: woocommerce-mcp
spec:
  selector:
    app.kubernetes.io/name: {{ include "urumi.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: woocommerce-mcp
  ports:
    - name: http
      port: 8101
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-woocommerce-mcp
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: woocommerce-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "urumi.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: woocommerce-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "urumi.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: woocommerce-mcp
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: woocommerce-mcp
          image: {{ include "urumi.image" (list . .Values.woocommerceMcp.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8101
          env:
            - name: WOOCOMMERCE_MCP_HOST
              value: 0.0.0.0
            - name: WOOCOMMERCE_MCP_PORT
              value: "8101"
            - name: WOOCOMMERCE_BASE_URL
              value: {{ $storeUrl | quote }}
            - name: WOOCOMMERCE_SIGNING_BASE_URL
              value: {{ if .Values.woocommerce.enabled }}{{ .Values.woocommerce.publicUrl | default $storeUrl | quote }}{{ else }}{{ $storeUrl | quote }}{{ end }}
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: woocommerce-consumer-key
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: woocommerce-consumer-secret
            - name: MCP_ALLOWED_HOSTS
              value: "{{ $full }}-woocommerce-mcp,{{ $full }}-woocommerce-mcp:*,localhost:*,127.0.0.1:*"
            - name: LOG_LEVEL
              value: {{ .Values.woocommerceMcp.logLevel | default "INFO" | quote }}
            {{- range $key, $value := .Values.woocommerceMcp.env }}
            {{- if ne $key "WOOCOMMERCE_BASE_URL" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}
{{- end }}
