{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "urumi.fullname" . }}
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "urumi.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The dashboard reverse-proxies /api, /mcp and /agent/api, so a single
          # backend keeps all cookies same-site (SameSite=strict sessions).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-dashboard
                port:
                  number: {{ .Values.dashboard.service.port }}
{{- end }}
