{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "urumi.secretName" . }}
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
stringData:
  gateway-secret-key: {{ .Values.secrets.gatewaySecretKey | quote }}
  bootstrap-admin-password: {{ .Values.secrets.bootstrapAdminPassword | quote }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | quote }}
  langsmith-api-key: {{ .Values.secrets.langsmithApiKey | quote }}
  woocommerce-consumer-key: {{ .Values.secrets.woocommerceConsumerKey | quote }}
  woocommerce-consumer-secret: {{ .Values.secrets.woocommerceConsumerSecret | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  mariadb-root-password: {{ .Values.secrets.mariadbRootPassword | quote }}
  mariadb-password: {{ .Values.secrets.mariadbPassword | quote }}
{{- end }}
