# Kind cluster for local development of the Urumi platform.
# The dashboard is exposed through a NodePort (30080) mapped to host 8088.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: urumi
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        protocol: TCP
      - containerPort: 30081
        hostPort: 8081
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
