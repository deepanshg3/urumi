[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:woocommerce-mcp]
command=python -m services.woocommerce_mcp
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/woocommerce-mcp.err.log
stdout_logfile=/var/log/supervisor/woocommerce-mcp.out.log
environment=PYTHONPATH="/app",WOOCOMMERCE_MCP_HOST="127.0.0.1",WOOCOMMERCE_MCP_PORT="8101",MCP_ALLOWED_HOSTS="127.0.0.1:*,localhost:*,woocommerce-mcp:*,inventory-mcp:*,shipping-mcp:*,gateway:*",MCP_ALLOWED_ORIGINS="http://127.0.0.1:*,http://localhost:*"

[program:inventory-mcp]
command=python -m services.inventory_mcp
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/inventory-mcp.err.log
stdout_logfile=/var/log/supervisor/inventory-mcp.out.log
environment=PYTHONPATH="/app",INVENTORY_MCP_HOST="127.0.0.1",INVENTORY_MCP_PORT="8102",MCP_ALLOWED_HOSTS="127.0.0.1:*,localhost:*,woocommerce-mcp:*,inventory-mcp:*,shipping-mcp:*,gateway:*",MCP_ALLOWED_ORIGINS="http://127.0.0.1:*,http://localhost:*"

[program:shipping-mcp]
command=python -m services.shipping_mcp
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/shipping-mcp.err.log
stdout_logfile=/var/log/supervisor/shipping-mcp.out.log
environment=PYTHONPATH="/app",SHIPPING_MCP_HOST="127.0.0.1",SHIPPING_MCP_PORT="8103",SHIPPING_DATABASE_URL="sqlite+aiosqlite:////app/data/shipping.db",MCP_ALLOWED_HOSTS="127.0.0.1:*,localhost:*,woocommerce-mcp:*,inventory-mcp:*,shipping-mcp:*,gateway:*",MCP_ALLOWED_ORIGINS="http://127.0.0.1:*,http://localhost:*"

[program:gateway]
command=python -m services.gateway
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stderr_logfile=/var/log/supervisor/gateway.err.log
stdout_logfile=/var/log/supervisor/gateway.out.log
environment=PYTHONPATH="/app",GATEWAY_HOST="127.0.0.1",GATEWAY_PORT="8000",DATABASE_URL="sqlite+aiosqlite:////app/data/gateway.db",GATEWAY_SERVERS_CONFIG="/app/config/servers.render.yaml",GATEWAY_ALLOWED_HOSTS="127.0.0.1:*,localhost:*,gateway:*",GATEWAY_ALLOWED_ORIGINS="*",GATEWAY_CORS_ORIGINS="*",GATEWAY_ALLOWED_UPSTREAM_HOSTS="127.0.0.1,localhost,woocommerce-mcp,inventory-mcp,shipping-mcp,gateway",LOG_LEVEL="INFO"

[program:agent]
; The agent shares the gateway's SQLite file and also creates the schema and
; default roles at startup. Wait for the gateway so the two never race on a
; fresh database (which crashes the gateway with an integrity/lock error).
command=bash -c "until curl -sf http://127.0.0.1:8000/health >/dev/null; do sleep 1; done; exec python -m services.agent"
directory=/app
autostart=true
autorestart=true
startsecs=0
startretries=10
stderr_logfile=/var/log/supervisor/agent.err.log
stdout_logfile=/var/log/supervisor/agent.out.log
environment=PYTHONPATH="/app",AGENT_HOST="127.0.0.1",AGENT_PORT="8200",DATABASE_URL="sqlite+aiosqlite:////app/data/gateway.db",AGENT_GATEWAY_MCP_URL="http://127.0.0.1:8000/mcp"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
