[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urumi-mcp-gateway"
version = "0.1.0"
description = "Urumi MCP Gateway — team MCP gateway platform with WooCommerce, inventory and shipping MCP servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "langchain>=0.3,<2",
    "langchain-google-genai>=2,<4",
    "langsmith>=0.1,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "pyyaml>=6.0.1,<7",
    "aiosqlite>=0.20,<1",
    "cryptography>=42,<51",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29,<1",
]
# Slim runtime subset used by the MCP server container images. The Dockerfiles
# read this list directly from pyproject.toml, so versions stay in one place.
mcp = [
    "mcp>=1.2,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0.1,<7",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "aiosqlite>=0.20,<1",
    "cryptography>=42,<51",
]
dev = [
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
]
# LLM-specific dependencies for the chat agent image (installed together with
# the `mcp` extra: pip install ".[mcp,agent]"). Kept out of the gateway/MCP
# images so they stay small and cannot fail to start because of LLM imports.
agent = [
    "langchain>=0.3,<2",
    "langchain-google-genai>=2,<4",
    "langsmith>=0.1,<1",
]

[tool.setuptools]
packages = [
    "services",
    "services.common",
    "services.woocommerce_mcp",
    "services.inventory_mcp",
    "services.shipping_mcp",
    "services.gateway",
    "services.agent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a running local WooCommerce store (set URUMI_RUN_INTEGRATION=1)",
]
